name: build

# Build both CVs on every push and PR. Pushes to main also copy the
# academic CV to the website repo (edeno/edeno), whose own workflow then
# redeploys www.edenovellis.com.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            denovellis-cv.tex
            denovellis-cv-neurotech.tex

      - name: Industry CV must stay at 2 pages
        # TeX wraps log lines, so join them before matching.
        run: |
          pages=$(tr -d '\n' < denovellis-cv-neurotech.log | grep -o 'denovellis-cv-neurotech.pdf ([0-9]* pages' | grep -o '[0-9]*')
          echo "Industry CV: $pages pages"
          test "$pages" = 2

      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            denovellis-cv.pdf
            denovellis-cv-neurotech.pdf

  # Push the academic CV to the website. WEBSITE_DEPLOY_KEY is the private
  # half of a write deploy key on edeno/edeno; a push made with it (unlike
  # GITHUB_TOKEN) triggers the website's deploy workflow.
  sync-website:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cv-pdfs
          path: pdfs

      - uses: actions/checkout@v4
        with:
          repository: edeno/edeno
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
          path: website

      - name: Commit and push the CV
        working-directory: website
        run: |
          cp ../pdfs/denovellis-cv.pdf _static/eric_denovellis_CV.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _static/eric_denovellis_CV.pdf
          if git diff --cached --quiet; then echo "CV unchanged"; exit 0; fi
          git commit -m "Update CV from edeno/cv@${GITHUB_SHA::7}"
          git push
